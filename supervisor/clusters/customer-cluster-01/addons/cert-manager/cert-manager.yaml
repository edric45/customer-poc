# cert-manager on customer-cluster-01, as a VKS add-on. Issues the TLS
# certificate of the Istio gateway (customer-cluster-01/platform/).
#
# Declared HERE, on the Supervisor; VKS then installs it INTO the cluster.
#
#   AddonConfig   the settings
#   AddonInstall  which add-on, which cluster, which release
#
# Releases on offer, and the settings one accepts (note the --- before vmware):
#   kubectl -n vmware-system-vks-public get addonreleases | grep cert-manager
#   kubectl -n vmware-system-vks-public get addonconfigdefinition \
#     cert-manager.kubernetes.vmware.com.1.20.2---vmware.1-vks.1 -o yaml
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonConfig
metadata:
  name: customer-cluster-01-cert-manager
  namespace: customer-ns
  annotations:
    # ArgoCD applies the config (wave 0) before the install (wave 1).
    argocd.argoproj.io/sync-wave: "0"
spec:
  values:
    namespace: cert-manager
    # A self-signed ClusterIssuer, enough for POC gateway certificates. Only
    # self-signed issuers can be declared here; a CA, Vault or ACME issuer is
    # an ordinary manifest applied inside the cluster.
    issuers:
    - name: selfsigned
      self_signed:
        private_key:
          algorithm: RSA
          size: 4096
---
apiVersion: addons.kubernetes.vmware.com/v1alpha1
kind: AddonInstall
metadata:
  name: customer-cluster-01-cert-manager
  namespace: customer-ns
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  addonRef:
    name: cert-manager
  addonConfigNameTemplate: customer-cluster-01-cert-manager
  # Which cluster: every Cluster carries this label with its own name. If the
  # cluster does not exist yet, the install waits for it.
  clusters:
  - selector:
      matchLabels:
        cluster.x-k8s.io/cluster-name: customer-cluster-01
  crossNamespaceSelection: Blocked
  # Pinned, so the version only changes with a commit.
  releaseFilter:
    ref:
      name: cert-manager.kubernetes.vmware.com.1.20.2-vmware.1-vks.1
  # Deleting this AddonInstall uninstalls cert-manager from the cluster.
  stopMatchingBehavior: Delete
