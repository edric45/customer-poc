# What the platform team runs INSIDE customer-cluster-01: the shared Istio
# gateway, its certificate, and the Pod Security fix for gateway pods.
#
#   kubectl --context <supervisor> apply -f supervisor/applications/customer-cluster-01-platform.yaml
#
# Needs the istio and cert-manager add-ons installed first (it uses their
# CRDs and the istio-system namespace). Until then the sync fails and retries.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-cluster-01-platform
  namespace: customer-ns
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.customer.local/platform/customer-poc.git   # CHANGE
    targetRevision: main
    path: customer-cluster-01/platform
  destination:
    # The workload cluster, registered in ArgoCD under this name (README, step 5).
    name: customer-cluster-01
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry while the add-ons are still installing.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
