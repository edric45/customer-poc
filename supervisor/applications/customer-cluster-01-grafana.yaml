# Grafana in customer-cluster-01, from the open-source Helm chart (there is no
# VKS add-on for Grafana), reading the Prometheus that VKS installs by default.
#
#   kubectl --context <sv> apply -f supervisor/applications/customer-cluster-01-grafana.yaml
#
# Two sources, one Application:
#   1. the Grafana chart, values inline below
#   2. this repo's customer-cluster-01/monitoring/: namespace + HTTPRoute on the
#      shared Istio gateway (https://grafana.apps.customer.local)
#
# Chart: grafana-community/helm-charts. Grafana Labs' own repo
# (grafana.github.io/helm-charts) deprecated its "grafana" chart in Jan 2026
# at 10.5.15; the chart continues in the community repo. Versions:
#   https://grafana-community.github.io/helm-charts/index.yaml
#
# Data source: VKS installs Prometheus in every cluster by default (a
# ClusterAddon, seen in our lab), Service prometheus-server in namespace
# tanzu-system-monitoring, with node-exporter and kube-state-metrics.
#
# Needs first: the shared gateway (customer-cluster-01-platform) and the admin
# Secret (customer-cluster-01/monitoring/grafana-route.yaml).
#
# Images: the chart's defaults, docker.io/grafana/grafana and
# docker.io/curlimages/curl, pulled by the nodes through the proxy
# (osConfiguration.systemProxy in cluster.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-cluster-01-grafana
  namespace: customer-ns
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: customer-cluster-01
    namespace: grafana
  sources:
  - repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    # Pinned; Grafana 13.2.x. Raise with a commit.
    targetRevision: 13.5.1
    helm:
      releaseName: grafana
      valuesObject:
        # Login from the Secret created by hand. Without it the chart makes a
        # random password on every render, which ArgoCD sees as a change.
        admin:
          existingSecret: grafana-admin

        # Keeps users, edited dashboards and settings across restarts.
        persistence:
          enabled: true
          size: 5Gi
        # A ReadWriteOnce volume can't be shared by the old and new pod.
        deploymentStrategy:
          type: Recreate
        # The chown init container runs as root with CHOWN, which VKS's
        # "restricted" Pod Security rejects. fsGroup 472 sets ownership anyway.
        initChownData:
          enabled: false
        # A `helm test` pod; ArgoCD has no use for it.
        testFramework:
          enabled: false

        grafana.ini:
          server:
            root_url: https://grafana.apps.customer.local

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus-server.tanzu-system-monitoring.svc.cluster.local
              isDefault: true

        # Dashboards downloaded from grafana.com by an init container at
        # startup. Pods do NOT inherit the node proxy, so the download gets
        # the proxy explicitly.
        downloadDashboards:
          env:
            HTTPS_PROXY: http://proxy.customer.local:3128
            HTTP_PROXY: http://proxy.customer.local:3128
            NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,.customer.local
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
            - name: default
              orgId: 1
              folder: Kubernetes
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
        dashboards:
          default:
            node-exporter-full:
              gnetId: 1860
              revision: 45
            k8s-views-global:
              gnetId: 15757
              revision: 43
              datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
            k8s-views-namespaces:
              gnetId: 15758
              revision: 46
              datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
            k8s-views-nodes:
              gnetId: 15759
              revision: 40
              datasource:
              - name: DS_PROMETHEUS
                value: Prometheus
            k8s-views-pods:
              gnetId: 15760
              revision: 41
              datasource:
              - name: DS_PROMETHEUS
                value: Prometheus

  - repoURL: https://git.customer.local/platform/customer-poc.git   # CHANGE
    targetRevision: main
    path: customer-cluster-01/monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    # The namespace is in git (with its gateway label); create it before the rest.
    - CreateNamespace=true
