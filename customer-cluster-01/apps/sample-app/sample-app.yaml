# Sample application behind the shared Istio gateway:
#   https://sample.apps.customer.local  ->  customer-gateway  ->  Service sample  ->  pods
#
# Deployed INTO customer-cluster-01 by the ApplicationSet customer-cluster-01-apps
# (as Application app-sample-app). Copy this folder to onboard another app.
#
# The image comes straight from Docker Hub, pulled by the nodes through the
# proxy. For an image in Harbor, use harbor.customer.local/<project>/<image>
# (README step 2 pushes one to the library project).
apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
  labels:
    # Lets HTTPRoutes here attach to the shared gateway (allowedRoutes).
    customer.local/gateway-access: "true"
    # Joins the mesh: pods get an Envoy sidecar, mTLS between meshed pods.
    istio-injection: enabled
    # Sidecars set no seccomp profile, so "restricted" (the VKS default)
    # would reject them. With Istio CNI, "baseline" is enough.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample
  template:
    metadata:
      labels:
        app: sample
    spec:
      containers:
      - name: web
        # nginx built to run as non-root on port 8080.
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: sample-app
spec:
  selector:
    app: sample
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample
  namespace: sample-app
spec:
  parentRefs:
  - name: customer-gateway
    namespace: customer-gateway
    sectionName: https
  hostnames:
  - sample.apps.customer.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sample
      port: 80
